# Render Blueprint for the FastAPI backend.
# In Render: New > Blueprint > select this repo. Secrets marked sync: false
# are entered in the Render dashboard, never committed.
services:
  - type: web
    name: pramax-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL        # Neon connection string
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-4.5
      - key: ALLOWED_ORIGINS     # e.g. https://www.yourdomain.com,https://yourdomain.com
        sync: false
